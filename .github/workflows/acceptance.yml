name: Offline example checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The released xHW 0.0.1 (the commit these examples declare) and, apart, the
        # current default branch, so a later xHW change cannot hide behind a green run.
        xhw: ['aa44a807ecc512e1f545b57f4e45462bdfd111a0', '']
    name: ${{ matrix.os }}, xHW ${{ matrix.xhw == '' && 'default branch' || '0.0.1' }}
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DASK_NUM_WORKERS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: DanielCamarena/xhw
          ref: ${{ matrix.xhw }}
          path: .validation-core
      - run: python -m pip install './.validation-core[dev]' -r examples/requirements-interactive.txt
      - run: python -m pytest
      - run: python -m ruff check examples tests tools
      - run: python tools/validate_docs.py
# Real-data notebooks run locally with registered assets; CI does not download them.
